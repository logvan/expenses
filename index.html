<!DOCTYPE html>
<html lang="ru" data-brand="emerald">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расходы</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Расходы">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f2f4fa; --card:#ffffff; --card2:#eef0f7; --text:#121826; --muted:#6b7488; --line:rgba(18,24,38,.08);
  --green:#12a771; --red:#e5484d; --amber:#d99a0b; --shadow:0 8px 30px rgba(30,40,80,.08);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1017; --card:#161a23; --card2:#1e232f; --text:#f1f3f9; --muted:#8a92a6; --line:rgba(255,255,255,.07);
    --green:#34d399; --red:#fb7185; --amber:#fbbf24; --shadow:0 8px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1017; --card:#161a23; --card2:#1e232f; --text:#f1f3f9; --muted:#8a92a6; --line:rgba(255,255,255,.07);
  --green:#34d399; --red:#fb7185; --amber:#fbbf24; --shadow:0 8px 30px rgba(0,0,0,.35);
}

/* ---------- фирменные палитры (меняются атрибутом data-brand на <html>) ---------- */
:root{
  --hero-bg:linear-gradient(145deg,#0c3630 0%,#1a5f4e 100%);
  --hero-ring:rgba(222,196,140,.30);
  --hero-shadow:0 16px 38px rgba(12,54,48,.40);
  --accent:#2f9e83; --accent-soft:rgba(47,158,131,.16);
  --btn-bg:linear-gradient(135deg,#1a5f4e,#2a8c73); --btn-fg:#fff; --btn-shadow:0 10px 24px rgba(26,95,78,.38);
  --bar-bg:linear-gradient(90deg,#1a5f4e,#35a688);
}
:root[data-brand="navy"]{
  --hero-bg:linear-gradient(145deg,#0f1b34 0%,#223f74 100%);
  --hero-ring:rgba(222,196,140,.30);
  --hero-shadow:0 16px 38px rgba(15,27,52,.42);
  --accent:#5b86d6; --accent-soft:rgba(91,134,214,.17);
  --btn-bg:linear-gradient(135deg,#223f74,#3a65b0); --btn-fg:#fff; --btn-shadow:0 10px 24px rgba(34,63,116,.40);
  --bar-bg:linear-gradient(90deg,#223f74,#5b86d6);
}
:root[data-brand="graphite"]{
  --hero-bg:linear-gradient(145deg,#14161b 0%,#2c303a 100%);
  --hero-ring:rgba(214,184,120,.45);
  --hero-shadow:0 16px 38px rgba(0,0,0,.45);
  --accent:#c2a15e; --accent-soft:rgba(194,161,94,.18);
  --btn-bg:linear-gradient(135deg,#b8975a,#d9bf88); --btn-fg:#1a1608; --btn-shadow:0 10px 24px rgba(184,151,90,.35);
  --bar-bg:linear-gradient(90deg,#a98a4f,#d9bf88);
}
:root[data-brand="burgundy"]{
  --hero-bg:linear-gradient(145deg,#38101c 0%,#74293f 100%);
  --hero-ring:rgba(222,196,140,.30);
  --hero-shadow:0 16px 38px rgba(56,16,28,.42);
  --accent:#c25a75; --accent-soft:rgba(194,90,117,.17);
  --btn-bg:linear-gradient(135deg,#74293f,#a23d5b); --btn-fg:#fff; --btn-shadow:0 10px 24px rgba(116,41,63,.40);
  --bar-bg:linear-gradient(90deg,#74293f,#c25a75);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.35;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}

.app{max-width:520px;margin:0 auto;padding:12px 16px 130px;transition:opacity .2s}
.app.loading{opacity:.55;pointer-events:none}

/* верх */
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.nav{width:40px;height:40px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:24px;line-height:1;color:var(--text)}
.nav[disabled]{opacity:.3}
.mlabel{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.demo{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--card2);color:var(--muted)}

/* герой */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 20px 18px;color:#fff;
  background:var(--hero-bg);box-shadow:var(--hero-shadow),inset 0 0 0 1px var(--hero-ring)}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.12),rgba(255,255,255,0) 70%)}
.hl{font-size:13px;opacity:.85;font-weight:600}
.hbal{font-size:40px;font-weight:800;letter-spacing:-.02em;margin:4px 0 16px;position:relative;z-index:1}
.hpills{display:flex;gap:10px;position:relative;z-index:1}
.pill{flex:1;display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.10);border-radius:18px;padding:10px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pi{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background:rgba(255,255,255,.16)}
.pl{font-size:12px;opacity:.85}
.pv{font-size:16px;font-weight:700;white-space:nowrap}

/* баннер «Другое» */
.banner{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:13px 14px;border-radius:20px;text-align:left;
  background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line)}
.banner .bi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:rgba(251,191,36,.18)}
.banner .bt{flex:1;font-size:14px}
.banner .bt b{display:block;font-size:15px}
.banner .bt span{color:var(--muted);font-size:13px}
.banner .bgo{color:var(--accent);font-size:20px}

/* карточки */
.card{background:var(--card);border-radius:26px;padding:18px;margin-top:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h2{margin-bottom:14px}

.idetail{margin:2px 0 12px;padding:14px;border-radius:18px;background:var(--card2)}
.idetail .bar{background:var(--bg)}
.idetail .dhead{margin-bottom:6px}
.card .sech{margin-bottom:14px}
.card .sech h2{margin:0}
.plan{margin:0 0 16px;padding:12px 14px;border-radius:16px;background:var(--card2)}
.plan .pr{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-bottom:8px}
.plan .pr b{color:var(--text)}

.cat{display:flex;gap:12px;width:100%;text-align:left;padding:10px 8px;margin:0 -8px;border-radius:16px;transition:background .15s}
.cat + .cat{margin-top:2px}
.cat.sel{background:var(--card2)}
.cat.zero{opacity:.55}
.ico{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px}
.cinfo{flex:1;min-width:0}
.crow{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cname{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csum{font-weight:700;white-space:nowrap}
.bar{height:6px;border-radius:99px;background:var(--card2);margin:7px 0 5px;overflow:hidden}
.cat.sel .bar{background:var(--bg)}
.bar i{display:block;height:100%;border-radius:99px}
.csub{font-size:12.5px;color:var(--muted)}
.csub.over{color:var(--red)}
.chint{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* детализация */
.dhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.dhead .dt{flex:1;min-width:0}
.dhead .dt b{display:block;font-size:18px}
.dhead .dt span{color:var(--muted);font-size:13px}
.xbtn{width:34px;height:34px;border-radius:50%;background:var(--card2);font-size:18px;color:var(--muted)}
.dsec{margin-top:14px}
.dsec h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.drow{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;padding:6px 0}
.drow .dn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .dn em{font-style:normal;color:var(--muted);font-size:12.5px;margin-left:6px}
.drow .dv{font-weight:650;white-space:nowrap}
.tip{margin-top:12px;padding:11px 13px;border-radius:14px;background:rgba(251,191,36,.14);font-size:13.5px}

/* операции */
.txsec{margin-top:22px}
.sech{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.sech span{color:var(--muted);font-size:13px}
.filter{display:inline-flex;align-items:center;gap:8px;padding:7px 8px 7px 12px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-size:13.5px;margin-bottom:8px}
.filter .xbtn{width:24px;height:24px;font-size:13px}
.dayh{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:600;margin:16px 4px 6px}
.txgroup{background:var(--card);border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.tx{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:11px 14px;cursor:pointer}
.tx + .tx{border-top:1px solid var(--line)}
.tx .ico{width:40px;height:40px;font-size:19px;border-radius:13px}
.tinfo{flex:1;min-width:0}
.tdesc{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcat{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tamt{font-weight:700;white-space:nowrap}
.tamt.pos{color:var(--green)}
.tact{display:none;width:100%;gap:8px;padding-top:2px}
.tx.open .tact{display:flex}
.tact button{flex:1;padding:10px;border-radius:12px;background:var(--card2);font-weight:600;font-size:14px}
.tact .act-del{color:var(--red)}
.tact .act-del.sure{background:var(--red);color:#fff}
.empty{padding:34px 16px;text-align:center;color:var(--muted);background:var(--card);border-radius:22px;box-shadow:var(--shadow)}

/* FAB */
.fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;
  background:var(--btn-bg);color:var(--btn-fg);font-size:34px;font-weight:300;line-height:1;
  box-shadow:var(--btn-shadow);z-index:20;display:grid;place-items:center;transition:transform .15s}
.fab:active{transform:scale(.93)}

/* шторки */
.backdrop{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;
  padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  z-index:31;max-height:92%;overflow-y:auto}
.sheet.show{transform:none}
.grab{width:42px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;margin-bottom:16px}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.amtrow{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.amtrow input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:44px;font-weight:800;letter-spacing:-.02em;padding:0}
.amtrow span{font-size:30px;font-weight:700;color:var(--muted)}
.field{width:100%;border:0;outline:none;background:var(--card2);border-radius:14px;padding:13px 14px;font-size:16px;margin:6px 0 4px}
.lbl{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:14px 2px 8px}
.lbl em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:99px;background:var(--card2);font-size:14px;font-weight:600;border:1.5px solid transparent;white-space:nowrap}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.chips.scroll{max-height:150px;overflow-y:auto}
.save{width:100%;margin-top:18px;padding:16px;border-radius:18px;font-size:17px;font-weight:700;color:var(--btn-fg);
  background:var(--btn-bg);box-shadow:var(--btn-shadow)}
.save[disabled]{opacity:.5}
.shead{font-size:19px;font-weight:800;margin-bottom:4px}
.ssub{color:var(--muted);font-size:14px;margin-bottom:6px}
.learn{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px;border-radius:14px;background:var(--card2);font-size:14px}
.learn input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.learn input[type=text]{flex:1;min-width:0;border:0;background:var(--card);border-radius:10px;padding:8px 10px;font-size:15px;outline:none}
#aDateIn{display:none;margin-top:8px}
#aDateIn.show{display:block}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;max-width:88%;
  background:#1c2030;color:#fff;padding:12px 18px;border-radius:16px;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:50;
  transition:all .25s;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#c2303c}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.apptitle{font-size:24px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.gear{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--text)}
.gear:active{transform:scale(.94)}
.sheet.tall{height:90%}
.shrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.shrow .xbtn{flex:none}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted)}
.sw i{width:46px;height:46px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.sw.on{color:var(--text)}
.sw.on i{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--accent)}
.addcat{margin-left:auto;padding:6px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;text-transform:none;letter-spacing:0}
.srow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 6px;border-radius:14px}
.srow:active{background:var(--card2)}
.srow .ico{width:38px;height:38px;font-size:18px;border-radius:12px}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;white-space:nowrap}
.chev{color:var(--muted);font-size:20px}
textarea.field{resize:none;font-family:inherit;display:block}
.fhint{color:var(--muted);font-size:12.5px;margin:2px 2px 0}
.danger{width:100%;margin-top:10px;padding:14px;border-radius:16px;background:var(--card2);color:var(--red);font-weight:700;font-size:16px}
.danger.sure{background:var(--red);color:#fff}
.field[disabled]{opacity:.6}
[hidden]{display:none !important}
</style>
</head>
<body>
<div class="app loading" id="app">
  <div class="topbar"><div class="apptitle">Расходы<span class="demo" id="demoBadge" hidden>демо</span></div><button class="gear" id="gear" aria-label="Настройки"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div>
  <header class="top">
    <button class="nav" id="prev" aria-label="Предыдущий месяц">‹</button>
    <div class="mlabel"><span id="monthLabel">…</span></div>
    <button class="nav" id="next" aria-label="Следующий месяц">›</button>
  </header>

  <section class="hero" id="hero"></section>
  <div id="otherBanner"></div>
  <section class="card" id="listCard"></section>

  <section class="txsec">
    <div class="sech"><h2>Операции</h2><span id="txCount"></span></div>
    <div id="filterBar"></div>
    <div id="txList"></div>
  </section>
</div>

<button class="fab" id="fab" aria-label="Добавить запись">+</button>
<div class="backdrop" id="backdrop"></div>

<!-- Добавить запись -->
<div class="sheet" id="sheetAdd" aria-hidden="true">
  <div class="grab"></div>
  <div class="seg" id="aType">
    <button data-type="Расход" class="on">Расход</button>
    <button data-type="Доход">Доход</button>
  </div>
  <div class="amtrow"><input id="aAmt" inputmode="decimal" autocomplete="off" placeholder="0"><span>₽</span></div>
  <input class="field" id="aNote" autocomplete="off" placeholder="На что? Например: кофе зерна">

  <div id="aCatWrap">
    <div class="lbl">Статья <em id="aAuto"></em></div>
    <div class="chips scroll" id="aCats"></div>
    <div id="aSubWrap" hidden>
      <div class="lbl">Подстатья</div>
      <div class="chips" id="aSubs"></div>
    </div>
  </div>

  <div class="lbl">Дата</div>
  <div class="chips" id="aDate">
    <button class="chip on" data-d="today">Сегодня</button>
    <button class="chip" data-d="yest">Вчера</button>
    <button class="chip" data-d="custom">Другая…</button>
  </div>
  <input class="field" type="date" id="aDateIn">
  <button class="save" id="aSave">Записать</button>
</div>

<!-- Сменить статью -->
<div class="sheet" id="sheetRecat" aria-hidden="true">
  <div class="grab"></div>
  <div class="shead">Сменить статью</div>
  <div class="ssub" id="rInfo"></div>
  <div class="lbl">Статья</div>
  <div class="chips scroll" id="rCats"></div>
  <div id="rSubWrap" hidden>
    <div class="lbl">Подстатья</div>
    <div class="chips" id="rSubs"></div>
  </div>
  <label class="learn"><input type="checkbox" id="rLearn"><span>Запомнить слово</span><input type="text" id="rWord" autocomplete="off"></label>
  <button class="save" id="rSave">Сохранить</button>
</div>

<!-- Настройки -->
<div class="sheet tall" id="sheetSettings" aria-hidden="true">
  <div class="grab"></div>
  <div class="shrow"><div class="shead">Настройки</div><button class="xbtn" id="sClose" aria-label="Закрыть">✕</button></div>
  <div class="lbl">Цвет приложения</div>
  <div class="swatches" id="sSwatches">
    <button class="sw" data-brand="emerald"><i style="background:linear-gradient(135deg,#0c3630,#1a5f4e)"></i>Изумруд</button>
    <button class="sw" data-brand="navy"><i style="background:linear-gradient(135deg,#0f1b34,#223f74)"></i>Синий</button>

/* ---------- API ---------- */
async function call(action, payload) {
  const body = Object.assign({action: action}, payload || {});
  if (TG && TG.initData) body.initData = TG.initData; else body.key = ACCESS_KEY;
  let res;
  try {
    // text/plain — «простой» запрос без предварительной проверки CORS, Apps Script принимает его как есть
    res = await fetch(API_URL, {method: 'POST', redirect: 'follow', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(body)});
  } catch (e) {
    throw new Error('Нет связи с сервером (' + (e && e.message || e) + '). Проверь интернет и адрес скрипта.');
  }
  let j, raw = '';
  try { raw = await res.text(); j = JSON.parse(raw); } catch (e) { throw new Error('Сервер ответил не так (HTTP ' + res.status + '): ' + raw.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 140) + ' — проверь адрес скрипта и новую версию развёртывания.'); }
  if (!j.ok) throw new Error(j.error === 'auth' ? 'Нет доступа. Открой приложение кнопкой в чате с ботом.' : (j.error || 'Ошибка сервера'));
  return j.data;
}

function matchKey(words, desc, k) {
  if (k.indexOf(' ') >= 0) return desc.indexOf(k) >= 0;
  return words.some(function (w) { return w === k || (k.length >= 4 && w.indexOf(k) === 0); });
}
function norm(s) { return String(s || '').toLowerCase().replace(/ё/g, 'е'); }
function wordsOf(d) { return d.split(/[\s,.!?]+/).filter(Boolean); }

function detectSub(cat, desc) {
  const subs = state.data && state.data.subcatDefs[cat];
  if (!subs) return '';
  const d = norm(desc), w = wordsOf(d);
  let dflt = '';
  const names = Object.keys(subs);
  for (let i = 0; i < names.length; i++) {
    const keys = subs[names[i]];
    if (!keys.length) { dflt = names[i]; continue; }
    if (keys.some(function (k) { return matchKey(w, d, k); })) return names[i];
  }
  return dflt;
}
function detectCat(desc) {
  const d = norm(desc), w = wordsOf(d), data = state.data;
  const rules = data.rules || [];
  for (let i = 0; i < rules.length; i++) if (matchKey(w, d, rules[i].word)) return {cat: rules[i].category, sub: rules[i].sub || ''};
  const names = Object.keys(data.categories);
  for (let i = 0; i < names.length; i++) {
    const keys = data.categories[names[i]];
    for (let j = 0; j < keys.length; j++) if (matchKey(w, d, keys[j])) return {cat: names[i], sub: ''};
  }
  return {cat: 'Другое', sub: ''};
}
function isIncomeText(desc) {
  const w = wordsOf(norm(desc));
  return (state.data.incomeWords || []).some(function (k) { return w.some(function (x) { return k.length >= 4 ? x.indexOf(k) === 0 : x === k; }); });
}

function groupBy(list, keyFn) {
  const m = {};
  list.forEach(function (e) {
    const k = keyFn(e);
    if (!m[k]) m[k] = {key: k, sum: 0, n: 0};
    m[k].sum += e.amount; m[k].n++;
  });
  return Object.keys(m).map(function (k) { return m[k]; }).sort(function (a, b) { return b.sum - a.sum; });
}

let loadSeq = 0;
async function load() {
  const my = ++loadSeq;
  const cached = readCache();
  if (cached) {
    state.data = cached;
    ICONS = Object.assign({}, ICONS_BASE, cached.icons || {});
    render();
    $('#app').classList.remove('loading');
  } else {
    setLoading(true);
  }
  try {
    const fresh = await api.month(state.year, state.month);
    if (my !== loadSeq) return;
    state.data = fresh;
    ICONS = Object.assign({}, ICONS_BASE, fresh.icons || {});
    writeCache(fresh);
    render();
  } catch (e) {
    if (my === loadSeq) {
      toast(cached ? 'Показаны сохранённые данные: ' + e.message : (e.message || 'Не удалось загрузить данные'), true);
      if (!cached) showLoadError(e.message || String(e));
    }
  } finally {
    if (my === loadSeq) setLoading(false);
  }
}

/* ---------- отрисовка ---------- */
function render() {
  const d = state.data;
  if (!d) return;
  applyBrand((d.settings && d.settings.brand) || 'emerald');
  $('#monthLabel').textContent = MONTHS[d.month] + ' ' + d.year;
  const t = parseYmd(d.today);
  $('#next').disabled = (state.year > t.getFullYear()) || (state.year === t.getFullYear() && state.month >= t.getMonth());
  if (state.filter && !d.cats.some(function (c) { return c.name === state.filter; })) state.filter = null;
  renderHero(); renderBanner(); renderCats(); renderTx();
}

function renderHero() {
  const d = state.data;
  const bal = d.income - d.spent;
  const sign = bal < 0 ? '−' : (bal > 0 ? '+' : '');
  $('#hero').innerHTML =
    '<div class="hl">Баланс · ' + MONTHS[d.month] + '</div>' +
    '<div class="hbal">' + sign + money(bal) + '</div>' +
    '<div class="hpills">' +
      '<div class="pill"><span class="pi">↓</span><div><div class="pl">Доходы</div><div class="pv">' + money(d.income) + '</div></div></div>' +
      '<div class="pill"><span class="pi">↑</span><div><div class="pl">Расходы</div><div class="pv">' + money(d.spent) + '</div></div></div>' +
    '</div>';
}

function renderBanner() {
  const d = state.data;
  const o = d.cats.filter(function (c) { return c.name === 'Другое'; })[0];
  const el = $('#otherBanner');
  if (!o || !o.sum) { el.innerHTML = ''; return; }
  const n = expensesOf('Другое').length;
  el.innerHTML =
    '<button class="banner" data-cat="Другое"><div class="bi">✨</div>' +
    '<div class="bt"><b>«Другое»: ' + money(o.sum) + '</b><span>' + n + ' ' + plural(n, 'трата', 'траты', 'трат') + ' без статьи — разнеси, чтобы видеть куда уходят деньги</span></div>' +
    '<div class="bgo">›</div></button>';
}
function plural(n, a, b, c) {
  const m = n % 100, k = n % 10;
  if (m > 10 && m < 20) return c;
  if (k === 1) return a;
  if (k > 1 && k < 5) return b;
  return c;
}

function catHint(name) {
  const es = expensesOf(name);
  if (!es.length) return '';
  if (name === 'Другое') {
    return 'Внутри: ' + groupBy(es, descOf).slice(0, 3).map(function (g) { return g.key; }).join(' · ');
  }
  if (state.data.subcatDefs[name]) {
    const g = groupBy(es, function (e) { return subOf(e) || 'Без подстатьи'; });
    if (g.length > 1 || (g[0] && g[0].key !== 'Без подстатьи')) {
      return g.slice(0, 3).map(function (x) { return x.key + ' ' + fmt(x.sum); }).join(' · ');
    }
  }
  return '';
}

function renderCats() {
  const d = state.data;
  const spent = d.spent;
  let plan = '';
  if (d.budgetTotal > 0) {
    const pct = Math.round(spent / d.budgetTotal * 100);
    const left = d.budgetTotal - spent;
    plan = '<div class="plan"><div class="pr"><span>План на месяц · <b>' + money(d.budgetTotal) + '</b></span><span><b>' + pct + '%</b></span></div>' +
      '<div class="bar" style="margin:0"><i style="width:' + Math.min(pct, 100) + '%;background:' + (pct > 100 ? 'var(--red)' : 'var(--bar-bg)') + '"></i></div>' +
      '<div class="pr" style="margin:8px 0 0"><span>' + (left >= 0 ? 'Осталось ' + money(left) : 'Превышение ' + money(-left)) + '</span></div></div>';
  }

  let rows = '';
  d.cats.forEach(function (c) {
    const col = colorOf(c.name);
    const hasB = c.budget > 0;
    const w = hasB ? Math.min(c.sum / c.budget * 100, 100) : (spent ? c.sum / spent * 100 : 0);
    const over = hasB && c.sum > c.budget;
    let sub;
    if (hasB) sub = over ? 'Превышение ' + money(c.sum - c.budget) + ' · план ' + fmt(c.budget)
                         : 'из ' + fmt(c.budget) + ' · осталось ' + fmt(c.budget - c.sum);
    else sub = Math.round(spent ? c.sum / spent * 100 : 0) + '% расходов';
    const hint = catHint(c.name);
    rows += '<button class="cat' + (state.filter === c.name ? ' sel' : '') + (c.sum ? '' : ' zero') + '" data-cat="' + esc(c.name) + '">' +
      '<div class="ico" style="background:' + col + '26">' + ic(c.name) + '</div>' +
      '<div class="cinfo"><div class="crow"><span class="cname">' + esc(c.name) + '</span><span class="csum">' + money(c.sum) + '</span></div>' +
      '<div class="bar"><i style="width:' + w.toFixed(1) + '%;background:' + (over ? 'var(--red)' : col) + '"></i></div>' +
      '<div class="csub' + (over ? ' over' : '') + '">' + sub + '</div>' +
      (hint ? '<div class="chint">' + esc(hint) + '</div>' : '') + '</div></button>';
    if (state.filter === c.name) rows += '<div class="idetail">' + detailHtml(c.name) + '</div>';
  });
  $('#listCard').innerHTML = '<div class="sech"><h2>Расходы по статьям</h2><span>' + money(spent) + '</span></div>' + plan + (rows || '<div class="csub">Пока нет трат за этот месяц</div>');
}

function detailHtml(name) {
  const d = state.data;
  const es = expensesOf(name);
  const total = es.reduce(function (s, e) { return s + e.amount; }, 0);
  const budget = d.budgets[name] || 0;
  const col = colorOf(name);
  let html = '<div class="dhead"><div class="ico" style="background:' + col + '26">' + ic(name) + '</div>' +
    '<div class="dt"><b>' + esc(name) + '</b><span>' + money(total) + ' · ' + es.length + ' ' + plural(es.length, 'запись', 'записи', 'записей') +
    (budget ? ' · план ' + fmt(budget) : '') + '</span></div><button class="xbtn" id="clearFilter" aria-label="Закрыть">✕</button></div>';

  if (!es.length) {
    html += '<div class="csub">В этом месяце трат по статье нет.</div>';
  } else {
    if (d.subcatDefs[name]) {
      const g = groupBy(es, function (e) { return subOf(e) || 'Без подстатьи'; });
      html += '<div class="dsec"><h3>По подстатьям</h3>';
      g.forEach(function (x) {
        html += '<div class="drow"><span class="dn">' + esc(x.key) + '<em>' + x.n + ' ' + plural(x.n, 'раз', 'раза', 'раз') + '</em></span><span class="dv">' + money(x.sum) + '</span></div>' +
          '<div class="bar" style="margin:0 0 4px"><i style="width:' + (x.sum / total * 100).toFixed(1) + '%;background:' + col + '"></i></div>';
      });
      html += '</div>';
    }
    const g2 = groupBy(es, descOf).slice(0, name === 'Другое' ? 20 : 8);
    html += '<div class="dsec"><h3>' + (name === 'Другое' ? 'Что внутри' : 'По названиям') + '</h3>';
    g2.forEach(function (x) {
      html += '<div class="drow"><span class="dn">' + esc(cap(x.key)) + (x.n > 1 ? '<em>×' + x.n + '</em>' : '') + '</span><span class="dv">' + money(x.sum) + '</span></div>';
    });
    html += '</div>';
    if (name === 'Другое') {
      html += '<div class="tip">Нажми на запись в списке ниже → «Сменить статью». Если отметить «Запомнить слово», в следующий раз бот сам отнесёт такую трату к нужной статье.</div>';
    }
  }
  return html;
}

function dayLabel(day) {
  const d = state.data;
  if (day === d.today) return 'Сегодня';
  const y = parseYmd(d.today); y.setDate(y.getDate() - 1);
  if (day === ymd(y)) return 'Вчера';
  const p = parseYmd(day);
  return p.getDate() + ' ' + MONTH_GEN[p.getMonth()] + ', ' + WD[p.getDay()];
}

function renderTx() {
  const d = state.data;
  let items = d.entries;
  if (state.filter) items = items.filter(function (e) { return e.category === state.filter; });
  $('#txCount').textContent = items.length ? items.length + ' ' + plural(items.length, 'запись', 'записи', 'записей') : '';
  $('#filterBar').innerHTML = state.filter ?
    '<div class="filter">' + (ICONS[state.filter] || '') + ' ' + esc(state.filter) + '<button class="xbtn" id="clearFilter2" aria-label="Сбросить">✕</button></div>' : '';

  if (!items.length) {
    $('#txList').innerHTML = '<div class="empty">Записей пока нет.<br>Нажми «+» или напиши боту «кофе 300».</div>';
    return;
  }
  const groups = [];
  items.forEach(function (e) {
    const g = groups.length ? groups[groups.length - 1] : null;
    if (g && g.day === e.day) g.items.push(e); else groups.push({day: e.day, items: [e]});
  });
  let html = '';
  groups.forEach(function (g) {
    const dayTotal = g.items.filter(function (e) { return e.type === 'Расход'; }).reduce(function (s, e) { return s + e.amount; }, 0);
    html += '<div class="dayh"><span>' + dayLabel(g.day) + '</span><span>' + (dayTotal ? '−' + money(dayTotal) : '') + '</span></div><div class="txgroup">';
    g.items.forEach(function (e) {
      const inc = e.type === 'Доход';
      const col = inc ? '#34d399' : colorOf(e.category);
      const sub = e.sub || (e.type === 'Расход' ? detectSub(e.category, e.desc) : '');
      const sure = state.confirm === e.row;
      html += '<div class="tx' + (state.open === e.row ? ' open' : '') + '" data-row="' + e.row + '">' +
        '<div class="ico" style="background:' + col + '26">' + (inc ? '💰' : ic(e.category)) + '</div>' +
        '<div class="tinfo"><div class="tdesc">' + esc(cap(e.desc || e.category)) + '</div>' +
        '<div class="tcat">' + esc(e.category) + (sub ? ' · ' + esc(sub) : '') + ' · ' + e.time + '</div></div>' +
        '<div class="tamt' + (inc ? ' pos' : '') + '">' + (inc ? '+' : '−') + money(e.amount) + '</div>' +
        '<div class="tact">' + (inc ? '' : '<button class="act-recat" data-row="' + e.row + '">Сменить статью</button>') +
        '<button class="act-del' + (sure ? ' sure' : '') + '" data-row="' + e.row + '">' + (sure ? 'Точно удалить?' : 'Удалить') + '</button></div></div>';
    });
    html += '</div>';
  });
  $('#txList').innerHTML = html;
}

/* ---------- действия ---------- */
function entryByRow(row) { return state.data.entries.filter(function (e) { return e.row === row; })[0]; }

function toggleFilter(name) {
  state.filter = state.filter === name ? null : name;
  state.open = null; state.confirm = null;
  render();
  if (state.filter) {
    const el = document.querySelector('.cat.sel');
    if (el && el.scrollIntoView) el.scrollIntoView({behavior: 'smooth', block: 'start'});
  }
}

let confirmTimer = null;
async function onDelete(row) {
  if (state.confirm !== row) {
    state.confirm = row; renderTx();
    clearTimeout(confirmTimer);
    confirmTimer = setTimeout(function () { state.confirm = null; renderTx(); }, 3000);
    return;
  }
  const e = entryByRow(row);
  if (!e) return;
  clearTimeout(confirmTimer);
  try {
    await api.del(e.row, e.ts, e.amount);
    state.open = null; state.confirm = null;
    toast('Запись удалена');
    await load();
  } catch (err) { toast(err.message, true); }
}

/* ---------- шторка «Добавить» ---------- */
function openBackdrop(on) { $('#backdrop').classList.toggle('show', on); }
function closeSheets() {
  ['#sheetAdd', '#sheetRecat', '#sheetSettings', '#sheetCat'].forEach(function (s) { $(s).classList.remove('show'); $(s).setAttribute('aria-hidden', 'true'); });
  openBackdrop(false);
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
function showSheet(sel) {
  $(sel).classList.add('show'); $(sel).setAttribute('aria-hidden', 'false'); openBackdrop(true);
}

function openAdd() {
  if (!state.data) return;
  state.sheet = {type: 'Расход', amount: '', note: '', cat: null, sub: null, dateMode: 'today', date: '', typeTouched: false, saving: false};
  $('#aAmt').value = ''; $('#aNote').value = ''; $('#aDateIn').value = ''; $('#aDateIn').classList.remove('show');
  syncAdd();
  showSheet('#sheetAdd');
  setTimeout(function () { $('#aAmt').focus(); }, 340);
}

function effCat() {
  const s = state.sheet;
  if (s.cat) return s.cat;
  return s.note.trim() ? detectCat(s.note).cat : null;
}
function effSub() {
  const s = state.sheet, c = effCat();
  if (!c || !state.data.subcatDefs[c]) return null;
  return s.sub || detectSub(c, s.note) || null;
}

function syncAdd() {
  const s = state.sheet, d = state.data;
  Array.prototype.forEach.call($('#aType').children, function (b) { b.classList.toggle('on', b.dataset.type === s.type); });
  Array.prototype.forEach.call($('#aDate').children, function (b) { b.classList.toggle('on', b.dataset.d === s.dateMode); });
  const inc = s.type === 'Доход';
  $('#aCatWrap').hidden = inc;
  $('#aNote').placeholder = inc ? 'Откуда? Например: зарплата' : 'На что? Например: кофе зерна';
  if (inc) return;
  const eff = effCat();
  const names = Object.keys(d.categories).concat(['Другое']);
  $('#aCats').innerHTML = names.map(function (n) {
    return '<button class="chip' + (eff === n ? ' on' : '') + '" data-chip="' + esc(n) + '">' + ic(n) + ' ' + esc(n) + '</button>';
  }).join('');
  $('#aAuto').textContent = s.cat ? 'выбрано вручную' : (eff ? 'определено автоматически' : 'определится по названию');
  const defs = eff && d.subcatDefs[eff];
  $('#aSubWrap').hidden = !defs;
  if (defs) {
    const es = effSub();
    $('#aSubs').innerHTML = Object.keys(defs).map(function (n) {
      return '<button class="chip' + (es === n ? ' on' : '') + '" data-sub="' + esc(n) + '">' + esc(n) + '</button>';
    }).join('');
  }
}

async function saveAdd() {
  const s = state.sheet, d = state.data;
  if (s.saving) return;
  const amount = parseFloat(String(s.amount).replace(/\s/g, '').replace(',', '.'));
  if (!(amount > 0)) { toast('Введи сумму', true); $('#aAmt').focus(); return; }
  const inc = s.type === 'Доход';
  const cat = inc ? 'Доход' : (effCat() || 'Другое');
  const sub = inc ? '' : (effSub() || '');
  const note = s.note.trim();
  const desc = note || (inc ? 'Доход' : cat);
  let date = d.today;
  if (s.dateMode === 'yest') { const y = parseYmd(d.today); y.setDate(y.getDate() - 1); date = ymd(y); }
  if (s.dateMode === 'custom' && s.date) date = s.date;
  s.saving = true; $('#aSave').disabled = true;
  try {
    await api.add({type: s.type, amount: amount, category: cat, sub: sub, desc: desc, date: date});
    closeSheets();
    toast('✅ ' + cap(desc) + ' — ' + money(amount) + ' → ' + cat + (sub ? ' / ' + sub : ''));
    await load();
  } catch (err) {
    toast(err.message, true);
  } finally {
    s.saving = false; $('#aSave').disabled = false;
  }
}

/* ---------- шторка «Сменить статью» ---------- */
function openRecat(row) {
  const e = entryByRow(row);
  if (!e) return;
  const first = wordsOf(norm(e.desc)).filter(function (w) { return w.length >= 3; })[0] || '';
  state.recat = {row: row, e: e, cat: e.category === 'Другое' ? null : e.category, sub: e.sub || null, word: first, learn: e.category === 'Другое'};
  $('#rInfo').textContent = cap(e.desc || e.category) + ' · ' + money(e.amount);
  $('#rWord').value = first; $('#rLearn').checked = state.recat.learn;
  syncRecat();
  showSheet('#sheetRecat');
}
function syncRecat() {
  const r = state.recat, d = state.data;
  const names = Object.keys(d.categories).concat(['Другое']);
  $('#rCats').innerHTML = names.map(function (n) {
    return '<button class="chip' + (r.cat === n ? ' on' : '') + '" data-rchip="' + esc(n) + '">' + ic(n) + ' ' + esc(n) + '</button>';
  }).join('');
  const defs = r.cat && d.subcatDefs[r.cat];
  $('#rSubWrap').hidden = !defs;
  if (defs) {
    const cur = r.sub || detectSub(r.cat, r.e.desc);
    $('#rSubs').innerHTML = Object.keys(defs).map(function (n) {
      return '<button class="chip' + (cur === n ? ' on' : '') + '" data-rsub="' + esc(n) + '">' + esc(n) + '</button>';
    }).join('');
  }
}
async function saveRecat() {
  const r = state.recat;
  if (!r.cat) { toast('Выбери статью', true); return; }
  const defs = state.data.subcatDefs[r.cat];
  const sub = defs ? (r.sub || detectSub(r.cat, r.e.desc) || '') : '';
  const word = $('#rLearn').checked ? $('#rWord').value.trim().toLowerCase() : '';
  $('#rSave').disabled = true;
  try {
    await api.recat(r.e.row, r.e.ts, r.e.amount, r.cat, sub, word);
    closeSheets();
    state.open = null;
    toast('Статья изменена → ' + r.cat + (word ? ' · слово «' + word + '» запомнено' : ''));
    await load();
  } catch (err) { toast(err.message, true); }
  finally { $('#rSave').disabled = false; }
}


/* ---------- настройки: цвет и категории ---------- */
const BRANDS = {emerald: 'Изумруд', navy: 'Синий', graphite: 'Графит', burgundy: 'Бордо'};
function applyBrand(b) {
  if (!BRANDS[b]) b = 'emerald';
  document.documentElement.setAttribute('data-brand', b);
  try { localStorage.setItem('brand', b); } catch (e) {}
  Array.prototype.forEach.call(document.querySelectorAll('.sw'), function (x) {
    x.classList.toggle('on', x.getAttribute('data-brand') === b);
  });
}
function showOnly(sel) {
  ['#sheetAdd', '#sheetRecat', '#sheetSettings', '#sheetCat'].forEach(function (x) {
    if (x !== sel) { $(x).classList.remove('show'); $(x).setAttribute('aria-hidden', 'true'); }
  });
  showSheet(sel);
}
function openSettings() {
  if (!state.data) return;
  renderSettings();
  showOnly('#sheetSettings');
}
function renderSettings() {
  const d = state.data;
  const st = (d.settings && d.settings.cats) || {};
  $('#sCats').innerHTML = Object.keys(d.categories).map(function (n) {
    const info = st[n] || {};
    const custom = !!info.custom;
    const extra = (!custom && info.keys) ? info.keys.length : 0;
    const plan = d.budgets[n];
    return '<button class="srow" data-name="' + esc(n) + '"><div class="ico" style="background:' + colorOf(n) + '26">' + ic(n) + '</div>' +
      '<div class="cinfo"><div class="cname">' + esc(n) + '</div><div class="csub">' + (plan ? 'план ' + fmt(plan) + ' ₽' : 'без плана') + '</div></div>' +
      (custom ? '<span class="badge">своя</span>' : (extra ? '<span class="badge">+' + extra + ' ' + plural(extra, 'слово', 'слова', 'слов') + '</span>' : '')) +
      '<span class="chev">›</span></button>';
  }).join('');
}
async function setBrand(b) {
  applyBrand(b);
  if (state.data && state.data.settings) state.data.settings.brand = b;
  try { await api.saveBrand(b); } catch (e) { toast(e.message, true); }
}
function openCat(name) {
  const d = state.data;
  const st = (d.settings && d.settings.cats) || {};
  const isNew = !name;
  const builtin = !isNew && d.builtin.indexOf(name) >= 0;
  const info = st[name] || {};
  state.cat = {name: name || '', isNew: isNew, builtin: builtin, custom: !isNew && !builtin, sure: false};
  $('#cTitle').textContent = isNew ? 'Новая категория' : name;
  $('#cName').value = name || ''; $('#cName').disabled = !isNew;
  $('#cIcon').value = (!isNew && ICONS[name]) ? ICONS[name] : '';
  $('#cKeys').value = (info.keys || []).join(', ');
  $('#cBudget').value = (!isNew && d.budgets[name]) ? d.budgets[name] : '';
  const extraN = builtin ? (info.keys || []).length : 0;
  $('#cSub').textContent = builtin
    ? 'Встроенная категория: уже знает ' + (d.categories[name].length - extraN) + ' слов. Можно добавить свои слова, иконку и план.'
    : (isNew ? 'Придумай название и слова, по которым бот будет узнавать траты.' : 'Своя категория.');
  $('#cKeysHint').textContent = builtin ? 'Дополнительные слова через запятую, без цифр.' : 'Через запятую, без цифр. «бассейн» поймает и «бассейна».';
  $('#cDel').hidden = !state.cat.custom;
  $('#cDel').textContent = 'Удалить категорию'; $('#cDel').classList.remove('sure');
  showOnly('#sheetCat');
}
async function saveCat() {
  const c = state.cat, d = state.data;
  const name = c.isNew ? $('#cName').value.trim() : c.name;
  if (!name) { toast('Введи название', true); return; }
  if (c.isNew && (name in d.categories || name === 'Другое' || name === 'Доход')) { toast('Такая категория уже есть', true); return; }
  const budget = parseFloat(String($('#cBudget').value || '0').replace(/\s/g, '').replace(',', '.')) || 0;
  $('#cSave').disabled = true;
  try {
    await api.saveCat({name: name, icon: $('#cIcon').value.trim(), keys: $('#cKeys').value, budget: budget});
    await load();
    toast('Сохранено: ' + name);
    openSettings();
  } catch (err) { toast(err.message, true); }
  finally { $('#cSave').disabled = false; }
}
let delTimer = null;
async function delCat() {
  const c = state.cat, b = $('#cDel');
  if (!c.sure) {
    c.sure = true; b.textContent = 'Точно удалить?'; b.classList.add('sure');
    clearTimeout(delTimer);
    delTimer = setTimeout(function () { c.sure = false; b.textContent = 'Удалить категорию'; b.classList.remove('sure'); }, 3000);
    return;
  }
  clearTimeout(delTimer);
  try {
    await api.delCat(c.name);
    await load();
    toast('Категория удалена, прошлые записи сохранены');
    openSettings();
  } catch (err) { toast(err.message, true); }
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, isErr) {
  const t = $('#toast');
  t.textContent = msg; t.classList.toggle('err', !!isErr); t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2800);
}

/* ---------- события ---------- */
document.addEventListener('click', function (ev) {
  const t = ev.target;
  let el;
  if (t.closest('#gear')) { openSettings(); return; }
  if (t.closest('#sClose')) { closeSheets(); return; }
  if (t.closest('#cBack')) { openSettings(); return; }
  if (t.closest('#sAddCat')) { openCat(null); return; }
  if (t.closest('#cSave')) { saveCat(); return; }
  if (t.closest('#cDel')) { delCat(); return; }
  if ((el = t.closest('.sw'))) { setBrand(el.getAttribute('data-brand')); return; }
  if ((el = t.closest('.srow'))) { openCat(el.getAttribute('data-name')); return; }
  if (t.closest('#clearFilter') || t.closest('#clearFilter2')) { state.filter = null; state.open = null; render(); return; }
  if ((el = t.closest('[data-cat]'))) {
    toggleFilter(el.getAttribute('data-cat'));
    return;
  }
  if ((el = t.closest('.act-del'))) { onDelete(Number(el.dataset.row)); return; }
  if ((el = t.closest('.act-recat'))) { openRecat(Number(el.dataset.row)); return; }
  if ((el = t.closest('.tx'))) {
    const row = Number(el.dataset.row);
    state.open = state.open === row ? null : row; state.confirm = null; renderTx(); return;
  }
  if (t.closest('#prev')) { shiftMonth(-1); return; }
  if (t.closest('#next')) { shiftMonth(1); return; }
  if (t.closest('#fab')) { openAdd(); return; }
  if (t.closest('#backdrop')) { closeSheets(); return; }
  if (t.closest('#aSave')) { saveAdd(); return; }
  if (t.closest('#rSave')) { saveRecat(); return; }
  if ((el = t.closest('#aType button'))) { state.sheet.type = el.dataset.type; state.sheet.typeTouched = true; syncAdd(); return; }
  if ((el = t.closest('#aDate button'))) {
    state.sheet.dateMode = el.dataset.d;
    $('#aDateIn').classList.toggle('show', el.dataset.d === 'custom');
    if (el.dataset.d === 'custom' && !$('#aDateIn').value) { $('#aDateIn').value = state.data.today; state.sheet.date = state.data.today; }
    syncAdd(); return;
  }
  if ((el = t.closest('[data-chip]'))) { state.sheet.cat = el.dataset.chip; state.sheet.sub = null; syncAdd(); return; }
  if ((el = t.closest('[data-sub]'))) { state.sheet.sub = el.dataset.sub; syncAdd(); return; }
  if ((el = t.closest('[data-rchip]'))) { state.recat.cat = el.dataset.rchip; state.recat.sub = null; syncRecat(); return; }
  if ((el = t.closest('[data-rsub]'))) { state.recat.sub = el.dataset.rsub; syncRecat(); return; }
});

$('#aAmt').addEventListener('input', function (e) {
  e.target.value = e.target.value.replace(/[^\d.,\s]/g, '');
  state.sheet.amount = e.target.value;
});
$('#aNote').addEventListener('input', function (e) {
  const s = state.sheet;
  s.note = e.target.value;
  if (!s.typeTouched) s.type = isIncomeText(s.note) ? 'Доход' : 'Расход';
  syncAdd();
});
$('#aDateIn').addEventListener('change', function (e) { state.sheet.date = e.target.value; });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheets(); });

function shiftMonth(delta) {
  let m = state.month + delta, y = state.year;
  if (m < 0) { m = 11; y--; }
  if (m > 11) { m = 0; y++; }
  state.month = m; state.year = y; state.filter = null; state.open = null;
  load();
}

/* ---------- старт ---------- */
try { const sb = localStorage.getItem('brand'); if (sb) applyBrand(sb); } catch (e) {}
if (!REAL) $('#demoBadge').hidden = false;
load();
})();
</script>
</body>
</html>
